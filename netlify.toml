# Site statique : pas de build, on publie le dossier du site tel quel.
# (le site est dans un sous-dossier du dépôt, pas à la racine)
[build]
  publish = "alter-website-repo/alter-website"

# Vidéos et images : mises en cache longtemps par le navigateur
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/posters/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
